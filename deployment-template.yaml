apiVersion: apps/v1
kind: Deployment
metadata:
  name: <your-app-name>
spec:
  replicas: <how-many-copies>
  selector:
    matchLabels:
      app: <your-app-name>
  template:
    metadata:
      labels:
        app: <your-app-name>
    spec:
      containers:
        - name: <your-app-name>
          image: <your-image>:<tag>
          imagePullPolicy: Never
          ports:
            - containerPort: <port-your-app-listens-on>
